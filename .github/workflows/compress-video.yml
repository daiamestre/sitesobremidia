name: Compress Video

# Pipeline de compressão (F-85 / OF-F81-2). Disparado pela Edge Function process-media (repository_dispatch novo_video)
# com { media_id, file_path } lidos do BANCO.
# - F-188 (pedido do dono): TODO vídeo sai no padrão básico das TV Box MXQ 4K (classe Cortex-A7): H.264 perfil Main
#   nível 4.0, 24 fps, quadro-chave a cada 2 s, ~2,4 Mbps (teto 2,8), lado maior até 1920 px, AAC 128k, faststart.
#   Só deixa como está o vídeo que já cumpre o padrão (H.264 Main/Baseline, até 24,5 fps, até 3 Mbps, lado maior <= 1920).
#   (Antes: High 4.1 sem limite de fps e só comprimia acima de 6 Mbps; vídeos 1080p a 30 fps travavam no totem.)
# - Confere o resultado (duração igual ± 0,5 s e arquivo menor) antes de avisar o servidor; senão, "skipped".
# - Envia o MD5 novo: o Player compara o MD5 do arquivo com media.file_hash.
# - NÃO apaga o original: Players que ainda têm a URL antiga continuam baixando até sincronizar.

on:
  repository_dispatch:
    types: [novo_video]

concurrency:
  group: compress-${{ github.event.client_payload.media_id }}
  cancel-in-progress: false

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MEDIA_ID: ${{ github.event.client_payload.media_id }}
      ORIGINAL_PATH: ${{ github.event.client_payload.file_path }}
    steps:
      - name: Validar entrada
        run: |
          [[ "$MEDIA_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "media_id inválido"; exit 1; }
          [[ "$ORIGINAL_PATH" =~ ^[A-Za-z0-9._/-]+$ && "$ORIGINAL_PATH" != *..* ]] || { echo "file_path inválido"; exit 1; }

      - name: Instalar FFmpeg e Rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rclone jq

      - name: Configurar Rclone
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          EOF

      - name: Baixar original
        run: |
          rclone copyto "r2:${{ secrets.R2_BUCKET }}/$ORIGINAL_PATH" ./original.bin
          test -s original.bin

      - name: Decidir e comprimir
        run: |
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 original.bin)
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 original.bin)
          CODEC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 original.bin)
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 original.bin)
          BITS=$(ffprobe -v error -show_entries format=bit_rate -of csv=p=0 original.bin)
          PERFIL=$(ffprobe -v error -select_streams v:0 -show_entries stream=profile -of csv=p=0 original.bin)
          FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 original.bin | awk -F/ '{ if ($2>0) printf "%.3f", $1/$2; else print $1 }')
          MAIOR=$(( W > H ? W : H ))
          echo "original: ${W}x${H} codec=$CODEC perfil=$PERFIL fps=$FPS dur=$DUR bitrate=$BITS"
          FPS_OK=$(awk -v f="${FPS:-99}" 'BEGIN{print (f<=24.5)?1:0}')
          if [ "$MAIOR" -le 1920 ] && [ "${BITS:-0}" -le 3000000 ] && [ "$CODEC" = "h264" ] && [ "$FPS_OK" = "1" ] \
             && { [ "$PERFIL" = "Main" ] || [ "$PERFIL" = "Constrained Baseline" ] || [ "$PERFIL" = "Baseline" ]; }; then
            echo "RESULTADO=skipped" >> "$GITHUB_ENV"; echo "Já está no padrão básico (H.264 Main, 24 fps, leve): nada a fazer."; exit 0
          fi
          if [ "$W" -ge "$H" ]; then ESCALA="scale='min(1920,iw)':-2"; else ESCALA="scale=-2:'min(1920,ih)'"; fi
          # 24 fps só reduz: vídeo gravado abaixo de 24 fps fica como está
          if [ "$FPS_OK" = "1" ]; then FILTRO="$ESCALA"; else FILTRO="$ESCALA,fps=24"; fi
          # taxa: no máximo 2,4 Mbps e nunca acima de 85% da original (vídeo já leve não sai maior)
          ALVO=$(( ${BITS:-2400000} * 85 / 100 )); [ "$ALVO" -gt 2400000 ] && ALVO=2400000; [ "$ALVO" -lt 500000 ] && ALVO=500000
          TETO=$(( ALVO * 7 / 6 )); BUF=$(( TETO * 2 ))
          echo "destino: H.264 Main 4.0, filtro=$FILTRO, taxa=${ALVO} teto=${TETO}"
          ffmpeg -hide_banner -loglevel error -i original.bin -map 0:v:0 -map 0:a:0? \
            -vf "$FILTRO" -c:v libx264 -preset medium -profile:v main -level:v 4.0 -pix_fmt yuv420p \
            -b:v "$ALVO" -maxrate "$TETO" -bufsize "$BUF" -g 48 -keyint_min 48 \
            -c:a aac -b:a 128k -ac 2 -movflags +faststart -y comprimido.mp4
          DUR2=$(ffprobe -v error -show_entries format=duration -of csv=p=0 comprimido.mp4)
          T1=$(stat -c %s original.bin); T2=$(stat -c %s comprimido.mp4)
          echo "comprimido: dur=$DUR2 bytes $T1 -> $T2"
          OK=$(awk -v a="$DUR" -v b="$DUR2" 'BEGIN{d=a-b; if(d<0)d=-d; print (d<=0.5)?1:0}')
          if [ "$OK" != "1" ] || [ "$T2" -ge "$T1" ]; then
            echo "RESULTADO=skipped" >> "$GITHUB_ENV"; echo "Resultado não compensa (duração ou tamanho): original mantido."; exit 0
          fi
          echo "RESULTADO=ready" >> "$GITHUB_ENV"
          echo "NOVO_TAMANHO=$T2" >> "$GITHUB_ENV"
          echo "NOVO_MD5=$(md5sum comprimido.mp4 | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Enviar comprimido
        if: env.RESULTADO == 'ready'
        run: |
          # temp/<id>.mp4 -> <id>.mp4 (desenho original); qualquer outro caminho -> c/<caminho>.mp4
          SEM_EXT="${ORIGINAL_PATH%.*}"
          if [[ "$ORIGINAL_PATH" == temp/* ]]; then NOVO="${SEM_EXT#temp/}.mp4"; else NOVO="c/${SEM_EXT}.mp4"; fi
          rclone copyto comprimido.mp4 "r2:${{ secrets.R2_BUCKET }}/$NOVO" --s3-no-check-bucket \
            --header-upload "Content-Type: video/mp4" --header-upload "Cache-Control: public, max-age=31536000, immutable"
          echo "NOVO_PATH=$NOVO" >> "$GITHUB_ENV"

      - name: Avisar o servidor
        if: always()
        env:
          PIPELINE_SECRET: ${{ secrets.MEDIA_PIPELINE_SECRET }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then R="error"; else R="${RESULTADO:-error}"; fi
          if [ "$R" = "ready" ]; then
            PAYLOAD=$(jq -n --arg id "$MEDIA_ID" --arg o "$ORIGINAL_PATH" --arg p "$NOVO_PATH" --arg h "$NOVO_MD5" --argjson s "$NOVO_TAMANHO" \
              '{media_id:$id, status:"ready", original_path:$o, file_path:$p, file_hash:$h, file_size:$s}')
          else
            PAYLOAD=$(jq -n --arg id "$MEDIA_ID" --arg r "$R" '{media_id:$id, status:$r}')
          fi
          curl -sS -f -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/process-media" \
            -H "Content-Type: application/json" -H "x-pipeline-secret: $PIPELINE_SECRET" -d "$PAYLOAD"
