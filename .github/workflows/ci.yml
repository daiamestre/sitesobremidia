name: 🚀 SOBRE MÍDIA ERP — CI/CD Enterprise Pipeline

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ─── ETAPA 1: Qualidade de Código ─────────────────────────────────────────
  lint-and-typecheck:
    name: 🔍 Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

  # ─── ETAPA 2: Testes (Unit + Integration + Security) ─────────────────────
  unit-tests:
    name: 🧪 Unit + Integration + Security Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ─── ETAPA 3: Cobertura de Código ─────────────────────────────────────────
  coverage:
    name: 📊 Coverage Report
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run test:coverage

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # ─── ETAPA 4: Build de Produção ───────────────────────────────────────────
  build:
    name: 🏗️ Production Build + PWA
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite + PWA
        run: npm run build

      - name: Verify critical build artifacts
        run: |
          test -f dist/index.html && echo "✅ index.html OK"
          test -f dist/sw.js       && echo "✅ Service Worker OK"
          CHUNKS=$(ls dist/assets/*.js 2>/dev/null | wc -l)
          echo "✅ $CHUNKS JS chunks gerados"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 7

  # ─── ETAPA 5: E2E Playwright ──────────────────────────────────────────────
  e2e:
    name: 🎭 E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/

      - name: Serve build & run Playwright E2E
        run: |
          npx serve dist -l 4173 &
          sleep 3
          npx playwright test --reporter=list
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ─── ETAPA 6: Auditoria de Segurança npm ─────────────────────────────────
  security-audit:
    name: 🛡️ npm Security Audit
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=critical
        continue-on-error: true

  # ─── ETAPA 7: Quality Gate — bloqueia merge se qualquer check falhar ──────
  quality-gate:
    name: ✅ Quality Gate (bloqueio de merge)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, coverage, build, security-audit]
    if: always()
    steps:
      - name: Verificar todos os checks obrigatórios
        run: |
          STATUS_LINT="${{ needs.lint-and-typecheck.result }}"
          STATUS_TEST="${{ needs.unit-tests.result }}"
          STATUS_BUILD="${{ needs.build.result }}"

          echo "Lint/TypeScript: $STATUS_LINT"
          echo "Testes:          $STATUS_TEST"
          echo "Build:           $STATUS_BUILD"

          FAILED=0
          [ "$STATUS_LINT"  != "success" ] && echo "❌ Lint/TypeScript falhou" && FAILED=1
          [ "$STATUS_TEST"  != "success" ] && echo "❌ Testes falharam"        && FAILED=1
          [ "$STATUS_BUILD" != "success" ] && echo "❌ Build falhou"           && FAILED=1

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "🚫 Quality Gate REPROVADO — merge bloqueado."
            exit 1
          fi

          echo ""
          echo "✅ Quality Gate APROVADO — todos os checks passaram."
          echo "   Lint ✔  |  Testes ✔  |  Build ✔"
