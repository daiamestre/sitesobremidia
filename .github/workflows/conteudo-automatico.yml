name: Conteúdo automático (pastas da Biblioteca)

# F-94/F-95 — abastece as pastas automáticas da Biblioteca (arte SOBRE MÍDIA, 16:9 e 9:16):
#   Loterias/Sorteios (CAIXA), SOBREMÍDIA NEWS, Esportes, Futebol, Cinema, Turismo (notícias com foto),
#   Brasileirão/Premier/La Liga/Champions e Apostas Esportivas (jogos, sem odds), Datas Comemorativas,
#   Charadas, Humor, Memes, Curiosidades e Nostalgia (conteúdo próprio, troca semanal).
# A cada 3 horas e sob demanda (entrada 'somente' = lista de pastas, ex.: noticias,datas).
on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:
    inputs:
      somente:
        description: 'Só estas pastas (vazio = todas), ex.: noticias,datas'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: conteudo-automatico
  cancel-in-progress: false

jobs:
  conteudo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: scripts/conteudo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dependências do robô
        run: npm install --no-audit --no-fund
      - name: Navegador para gerar as artes
        run: npx playwright install --with-deps chromium
      - name: Gerar e publicar
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CONTENT_FACTORY_SECRET: ${{ secrets.CONTENT_FACTORY_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SOMENTE: ${{ inputs.somente }}
        run: node robo.mjs
